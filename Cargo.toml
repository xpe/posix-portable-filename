[package]
name = "posix-portable-filename"
version = "0.2.3"
edition = "2024"
authors = ["David James <07wz18rk@anonaddy.me>"]
description = "Constructs POSIX portable filenames (A-Za-z0-9._-)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xpe/posix-portable-filename"
documentation = "https://docs.rs/posix-portable-filename"
readme = "README.md"
keywords = ["posix", "filename", "validation", "portable"]
categories = ["filesystem", "parsing"]
rust-version = "1.85"

[dependencies]
thiserror = "2"

# `arbitrary` feature
arbitrary = { version = "1", optional = true }

# `serde` feature
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = []
arbitrary = ["dep:arbitrary"]
serde = ["dep:serde"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
arbtest = "0.3"
doc-comment = "0.3"
serde_assert = "0.8"
